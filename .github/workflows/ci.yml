name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend CI (Lint, Type Check, Build)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Backend CI (Lint, Playwright, Pytest & Coverage)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Install Playwright & Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Code Quality & Syntax Check (Flake8)
        run: |
          # Stop build if there are syntax errors or undefined names
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Informational warnings for complex code / style
          flake8 app tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Unit & Core Engine Tests
        run: |
          pytest -v -m "not slow and not browser" --cov=app --cov-report=xml --cov-report=term-missing

      - name: Run Browser Integration Tests
        run: |
          pytest -v -m "browser"

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-python-${{ matrix.python-version }}
          path: backend/coverage.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # Job 3: Docker & Compose Sanity Check
  # -------------------------------------------------------------
  docker-ci:
    name: Docker Builds & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Docker Image (Cache Test)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: accesslens-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image (Cache Test)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
          push: false
          tags: accesslens-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 4: Security & Dependency Scan
  # -------------------------------------------------------------
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Frontend Audit
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high || true

      - name: Backend Security Audit
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true
